<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>
    <nav>
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
        <a href="task5.html">Task 5</a>
        <a href="task6.html">Task 6</a>
        <a href="task7.html">Task 7</a>
        <a href="task8.html">Task 8</a>
    </nav>
    <h1>Interactive To-do list</h1>
    <main id="toDoApp">
        <section class="taskSection">
            <h2>To-do List</h2>
            <ul id="taskList"></ul>
        </section>

        <section class="formSection">
            <h2>Add new task</h2>
            <form id="taskForm">
                <label for="taskTitle">Title</label>
                <input type="text" id="taskTitle" placeholder="Enter task title.." required>

                <label for="taskDescription">Description</label>
                <textarea id="taskDescription" placeholder="Enter task description.." required></textarea>

                <button type="submit">Add task</button>
            </form>
        </section>
    </main>
    <script src="task8.js"></script>
</body>
</html>
