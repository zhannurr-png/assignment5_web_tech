    <h1>Calculator</h1>
    <div id="calculator">

        <div><input type="number" id="firstNumber" placeholder="First Number"></div>
        <div>
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        </div>
        <div><input type="number" id="secondNumber" placeholder="Second Number"></div>

        <button id="calculateButton">Calculate</button>
